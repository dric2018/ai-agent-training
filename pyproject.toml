[project]
name = "llm-training-module"
version = "0.1.0"
description = "Training module environment for LLM API testing and LangChain introduction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "vllm>=0.6.0; platform_system == 'Linux'",  # vLLM natively targets Linux/CUDA environments
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
